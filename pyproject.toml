[project]
name = "resume-rag-assistant"
version = "0.1.0"
description = "RAG-поиск по резюме с hh.ru: индексация, семантический поиск кандидатов и ответы LLM по базе резюме"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    # RAG
    "langchain-core>=0.3",
    "langchain-text-splitters>=0.3",
    "langchain-openai>=0.2",
    "langchain-huggingface>=0.1",
    "langchain-chroma>=0.2",
    "sentence-transformers>=3.2",
    "torch>=2.4",
    # Загрузка резюме
    "pypdf>=5.0",
    "docx2txt>=0.8",
]

[project.scripts]
resume-rag = "src.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# torch без CUDA: на Linux с PyPI иначе приезжает сборка с CUDA на несколько ГБ
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
